name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Release scripts tests
        run: |
          python3 scripts/parse-release-commit_test.py
          python3 scripts/check-release-version_test.py

  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Micro + smoke
        run: bash scripts/bench-ci.sh
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke
          path: |
            micro.txt
            smoke.json
      - name: Download main baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          name: bench-smoke
          workflow: ci.yml
          branch: ${{ github.event.pull_request.base.ref }}
          event: push
          path: bench-prev
          search_artifacts: true
          if_no_artifact_found: warn
      - name: Diff vs main
        if: always() && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          args=(-new smoke.json -out bench-comment.md)
          if [ -f bench-prev/smoke.json ]; then
            args+=(-old bench-prev/smoke.json)
          fi
          if [ -f bench-prev/micro.txt ]; then
            args+=(-old-micro bench-prev/micro.txt)
          fi
          if [ -f micro.txt ]; then
            args+=(-new-micro micro.txt)
          fi
          go run ./cmd/scbench-diff "${args[@]}"
          cat bench-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('bench-comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('bench-comment.md', 'utf8');
            const marker = '<!-- supercache-bench-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
      - name: Step summary
        if: always() && github.event_name != 'pull_request'
        run: |
          {
            echo "## Bench smoke"
            echo '```'
            tail -n 40 micro.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
