name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1
      - name: Release scripts tests
        run: |
          python3 scripts/parse-release-commit_test.py
          python3 scripts/check-release-version_test.py

  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Micro + smoke (this ref)
        run: bash scripts/bench-ci.sh .
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke
          path: |
            micro.txt
            smoke.json
      # Same VM as the PR benches above — do not compare across GitHub runners.
      - name: Checkout merge-base (main)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: bench-base-src
      - name: Micro + smoke (main, same runner)
        if: github.event_name == 'pull_request'
        run: bash scripts/bench-ci.sh "$RUNNER_TEMP/bench-base"
        working-directory: bench-base-src
      - name: Diff vs main (same runner)
        if: always() && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          args=(-new smoke.json -out bench-comment.md -same-runner)
          if [ -f "$RUNNER_TEMP/bench-base/smoke.json" ]; then
            args+=(-old "$RUNNER_TEMP/bench-base/smoke.json")
          fi
          if [ -f "$RUNNER_TEMP/bench-base/micro.txt" ]; then
            args+=(-old-micro "$RUNNER_TEMP/bench-base/micro.txt")
          fi
          if [ -f micro.txt ]; then
            args+=(-new-micro micro.txt)
          fi
          go run ./cmd/scbench-diff "${args[@]}"
          cat bench-comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('bench-comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('bench-comment.md', 'utf8');
            const marker = '<!-- supercache-bench-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
      - name: Step summary
        if: always() && github.event_name != 'pull_request'
        run: |
          {
            echo "## Bench smoke"
            echo '```'
            tail -n 40 micro.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Fails when cache.proto moves and the Python or Node client was not regenerated
  # or a facade method was not added. See docs/design/2026-10-08-polyglot-clients.md.
  clients-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install protoc 28.3
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - name: Install generators
        run: |
          python3 -m pip install 'grpcio-tools==1.69.0'
          npm ci --prefix clients/node
      - name: Regenerated stubs match the tree
        run: |
          bash scripts/gen-clients.sh
          git diff --exit-code -- clients/python/src/supercache/_gen clients/node/src/gen
      - name: Facades cover every Cache RPC
        run: python3 scripts/check-client-surface.py

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Conformance server
        run: go test ./clients/conformance/ -count=1
      - name: Python client
        run: |
          python3 -m pip install -e "./clients/python[dev]"
          pytest clients/python/tests -q
      - name: Node client
        working-directory: clients/node
        run: |
          npm ci
          npm test
          npm run build
