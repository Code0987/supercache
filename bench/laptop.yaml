# Laptop preset (~5–8 min).
tier: laptop
trials: 3
duration: 8s
warmup: 2s
keys: 20000
value_bytes: 256
dist: uniform
seed: 42
embed: true
collect_runtime: true
conns: 1
cells:
  - { op: get,  path: hit,            nodes: 1, concurrency: 1 }
  - { op: get,  path: hit,            nodes: 1, concurrency: 10 }
  - { op: get,  path: hit,            nodes: 1, concurrency: 100 }
  - { op: set,  path: put,            nodes: 1, concurrency: 10 }
  - { op: set,  path: put,            nodes: 1, concurrency: 100 }
  - { op: miss, path: miss-cacheonly, nodes: 1, concurrency: 10 }
  - { op: get,  path: hit,            nodes: 3, concurrency: 10 }
  - { op: set,  path: put,            nodes: 3, concurrency: 10 }
