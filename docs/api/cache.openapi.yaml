openapi: 3.0.3
info:
  title: SuperCache Cache API (gRPC reference)
  version: 0.7.0
  description: |
    **Application data plane** — gRPC service `supercache.cache.v1.Cache` on the
    node **`-cache`** port (default `9000`).

    This document is a **reference** for request/response shapes. It is **not** an
    HTTP API. Try-it-out will not work here.

    ### How to call it

    | Client | Example |
    |--------|---------|
    | Go | `pkg/client` — `client.Dial` / `DialTLS` |
    | CLI | `sc get` / `put` / `del` / `bloom` / `sadd` / `zadd` / `geoadd` / `lpush` / `hset` / `incr` … |
    | Proto | `api/proto/cache.proto` |

    ### Keyspace modes

    | Mode | RPCs |
    |------|------|
    | CacheOnly / LoadThrough | Get, Put, PutMany, Delete, DeleteMany |
    | ModeBloom | BloomAdd, BloomTest; Delete(name) |
    | ModeSet | SetAdd, SetRemove, SetContains, SetCard, SetMembers; Delete(name) |
    | ModeZSet | ZAdd, ZRem, ZScore, ZCard, ZRange, ZRangeByScore; Delete(name) |
    | ModeGeo | GeoAdd, GeoRem, GeoPos, GeoCard, GeoDist, GeoRadius; Delete(name) |
    | ModeList | LPush, RPush, LPop, RPop, LLen, LIndex, LRange; Delete(name) |
    | ModeHash | HSet, HGet, HDel, HExists, HLen, HGetAll; Delete(name) |
    | ModeCounter | Incr, CounterGet; Delete(name) |

    Wrong verb for the mode → invalid argument (gRPC InvalidArgument).

    ### Consistency (short)

    - **Get / SetContains / ZScore / GeoPos / LIndex / HGet / BloomTest** — observation on the **queried node** (may lag; non-replicas may owner-forward)
    - **Put / SetAdd / ZAdd / GeoAdd / LPush / HSet / BloomAdd** — ACK after **ring owner** accepts; async fan-out to replicas
    - **Delete** — owner tombstone + replica apply/hint; peer failures returned on first attempt

    Peer mesh (`api/proto/peer.proto`) is internal — do not expose to apps.
  contact:
    name: SuperCache
    url: https://github.com/Code0987/supercache
  license:
    name: MIT

servers:
  - url: grpc://{host}:{port}
    description: Cache gRPC (not HTTP)
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "9000"

tags:
  - name: KV
    description: Opaque key/value (ModeCacheOnly / ModeLoadThrough)
  - name: Bloom
    description: Approximate membership (ModeBloom)
  - name: Set
    description: Exact membership (ModeSet)
  - name: ZSet
    description: Sorted set with scores (ModeZSet)
  - name: Geo
    description: Geospatial point index (ModeGeo)
  - name: List
    description: Ordered list (ModeList)
  - name: Hash
    description: Named field map (ModeHash)
  - name: Counter
    description: Named int64 (ModeCounter)

paths:
  /supercache.cache.v1.Cache/Get:
    post:
      tags: [KV]
      operationId: Cache_Get
      summary: Get a key
      description: |
        gRPC `Get(GetRequest) returns (GetResponse)`.

        Returns `found=false` when missing or negative-cached (client maps to not found).
        Invalid on ModeBloom / ModeSet / ModeZSet / ModeGeo / ModeList / ModeHash / ModeCounter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetRequest"
            example:
              keyspace: demo
              key: greeting
      responses:
        "200":
          description: RPC response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetResponse"

  /supercache.cache.v1.Cache/Put:
    post:
      tags: [KV]
      operationId: Cache_Put
      summary: Put a key
      description: |
        gRPC `Put(PutRequest) returns (PutResponse)`.

        `ttl_set=true` applies `ttl_nanos` for this write (0 = no expiry).
        When `ttl_set=false`, the keyspace default TTL is used.
        Invalid on ModeBloom / ModeSet / ModeZSet / ModeGeo / ModeList / ModeHash / ModeCounter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutRequest"
            example:
              keyspace: demo
              key: greeting
              value: aGVsbG8=  # base64 "hello" in JSON mapping
              ttl_nanos: 60000000000
              ttl_set: true
      responses:
        "200":
          description: Accepted by owner (empty body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutResponse"

  /supercache.cache.v1.Cache/PutMany:
    post:
      tags: [KV]
      operationId: Cache_PutMany
      summary: Put many keys (not atomic)
      description: Partial failures returned as `errors[]`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutManyRequest"
      responses:
        "200":
          description: Per-key errors if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutManyResponse"

  /supercache.cache.v1.Cache/Delete:
    post:
      tags: [KV]
      operationId: Cache_Delete
      summary: Delete a key or named structure
      description: |
        Tombstones a KV key or a named Bloom/Set/ZSet entry.
        Peer apply failures appear in `peer_failures`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
      responses:
        "200":
          description: Delete attempted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /supercache.cache.v1.Cache/DeleteMany:
    post:
      tags: [KV]
      operationId: Cache_DeleteMany
      summary: Delete many keys (not atomic)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteManyRequest"
      responses:
        "200":
          description: Per-key errors if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteManyResponse"

  /supercache.cache.v1.Cache/BloomAdd:
    post:
      tags: [Bloom]
      operationId: Cache_BloomAdd
      summary: Add item to named Bloom filter
      description: ModeBloom only. Creates filter if missing. ORs bits on owner + replicas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BloomAddRequest"
            example:
              keyspace: seen
              name: users
              item: dXNlcjE=
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"

  /supercache.cache.v1.Cache/BloomTest:
    post:
      tags: [Bloom]
      operationId: Cache_BloomTest
      summary: Test item in named Bloom filter
      description: |
        `maybe=false` means definitely not present.
        Missing filter → maybe=false. ModeBloom only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BloomTestRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BloomTestResponse"

  /supercache.cache.v1.Cache/SetAdd:
    post:
      tags: [Set]
      operationId: Cache_SetAdd
      summary: Add item to named exact set
      description: ModeSet only. Idempotent if already present.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetItemRequest"
            example:
              keyspace: tags
              name: features
              item: ZGFya19tb2Rl
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"

  /supercache.cache.v1.Cache/SetRemove:
    post:
      tags: [Set]
      operationId: Cache_SetRemove
      summary: Remove item from named set
      description: ModeSet only. No-op if missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetItemRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"

  /supercache.cache.v1.Cache/SetContains:
    post:
      tags: [Set]
      operationId: Cache_SetContains
      summary: Exact membership test
      description: Missing set → present=false. ModeSet only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetItemRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetContainsResponse"

  /supercache.cache.v1.Cache/SetCard:
    post:
      tags: [Set]
      operationId: Cache_SetCard
      summary: Set cardinality
      description: Missing set → card=0. ModeSet only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"

  /supercache.cache.v1.Cache/SetMembers:
    post:
      tags: [Set]
      operationId: Cache_SetMembers
      summary: All set members
      description: Missing set → empty list. ModeSet only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetMembersResponse"

  /supercache.cache.v1.Cache/ZAdd:
    post:
      tags: [ZSet]
      operationId: Cache_ZAdd
      summary: Add or update scored member
      description: ModeZSet only. NaN score rejected. Creates zset if missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZAddRequest"
            example:
              keyspace: board
              name: top_tracks
              member: YWxpY2U=
              score: 100
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"

  /supercache.cache.v1.Cache/ZRem:
    post:
      tags: [ZSet]
      operationId: Cache_ZRem
      summary: Remove member from sorted set
      description: ModeZSet only. No-op if missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZMemberRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"

  /supercache.cache.v1.Cache/ZScore:
    post:
      tags: [ZSet]
      operationId: Cache_ZScore
      summary: Get member score
      description: Missing member/zset → present=false. ModeZSet only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZMemberRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZScoreResponse"

  /supercache.cache.v1.Cache/ZCard:
    post:
      tags: [ZSet]
      operationId: Cache_ZCard
      summary: Sorted set cardinality
      description: Missing zset → card=0. ModeZSet only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"

  /supercache.cache.v1.Cache/ZRange:
    post:
      tags: [ZSet]
      operationId: Cache_ZRange
      summary: Range by rank
      description: |
        Inclusive ranks; Redis-style negatives (`-1` = last).
        Order: score ascending, then member bytes. ModeZSet only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZRangeRequest"
            example:
              keyspace: board
              name: top_tracks
              start: 0
              stop: -1
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZRangeResponse"

  /supercache.cache.v1.Cache/ZRangeByScore:
    post:
      tags: [ZSet]
      operationId: Cache_ZRangeByScore
      summary: Range by score window
      description: Inclusive min/max scores. ModeZSet only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZRangeByScoreRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZRangeResponse"

  /supercache.cache.v1.Cache/GeoAdd:
    post:
      tags: [Geo]
      operationId: Cache_GeoAdd
      summary: Add or update member position
      description: ModeGeo only. WGS84 lon/lat; NaN, Inf, and out-of-range rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoAddRequest"
            example:
              keyspace: places
              name: city
              member: c2hvcA==
              lon: -74
              lat: 40.7
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"

  /supercache.cache.v1.Cache/GeoRem:
    post:
      tags: [Geo]
      operationId: Cache_GeoRem
      summary: Remove member from geo index
      description: ModeGeo only. No-op if missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoMemberRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"

  /supercache.cache.v1.Cache/GeoPos:
    post:
      tags: [Geo]
      operationId: Cache_GeoPos
      summary: Get member lon/lat
      description: Missing member/index → present=false. ModeGeo only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoMemberRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoPosResponse"

  /supercache.cache.v1.Cache/GeoCard:
    post:
      tags: [Geo]
      operationId: Cache_GeoCard
      summary: Geo index cardinality
      description: Missing index → card=0. ModeGeo only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardResponse"

  /supercache.cache.v1.Cache/GeoDist:
    post:
      tags: [Geo]
      operationId: Cache_GeoDist
      summary: Distance between two members
      description: Haversine meters. Missing either member → present=false. ModeGeo only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoDistRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoDistResponse"

  /supercache.cache.v1.Cache/GeoRadius:
    post:
      tags: [Geo]
      operationId: Cache_GeoRadius
      summary: Members within a radius
      description: |
        Inclusive radius in meters. Order: nearest first, then member bytes.
        `limit<=0` means no cap. ModeGeo only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoRadiusRequest"
            example:
              keyspace: places
              name: city
              lon: -74
              lat: 40.7
              radius_meters: 20000
              limit: 10
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoRadiusResponse"

  /supercache.cache.v1.Cache/LPush:
    post:
      tags: [List]
      operationId: Cache_LPush
      summary: Prepend item
      description: ModeList only. Creates the list if missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListItemRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"

  /supercache.cache.v1.Cache/RPush:
    post:
      tags: [List]
      operationId: Cache_RPush
      summary: Append item
      description: ModeList only. Creates the list if missing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListItemRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"

  /supercache.cache.v1.Cache/LPop:
    post:
      tags: [List]
      operationId: Cache_LPop
      summary: Pop head
      description: Missing or empty → present=false. ModeList only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPopResponse"

  /supercache.cache.v1.Cache/RPop:
    post:
      tags: [List]
      operationId: Cache_RPop
      summary: Pop tail
      description: Missing or empty → present=false. ModeList only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPopResponse"

  /supercache.cache.v1.Cache/LLen:
    post:
      tags: [List]
      operationId: Cache_LLen
      summary: List length
      description: Missing list → len=0. ModeList only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LLenResponse"

  /supercache.cache.v1.Cache/LIndex:
    post:
      tags: [List]
      operationId: Cache_LIndex
      summary: Element at index
      description: Redis-style negatives. OOB → present=false. ModeList only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LIndexRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPopResponse"

  /supercache.cache.v1.Cache/LRange:
    post:
      tags: [List]
      operationId: Cache_LRange
      summary: Range by index
      description: Inclusive start/stop; Redis-style negatives (`-1` = last). ModeList only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LRangeRequest"
            example:
              keyspace: inbox
              name: q
              start: 0
              stop: -1
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LRangeResponse"

  /supercache.cache.v1.Cache/HSet:
    post:
      tags: [Hash]
      operationId: Cache_HSet
      summary: Upsert field
      description: ModeHash only. Creates the hash if missing. Empty value allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HSetRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"

  /supercache.cache.v1.Cache/HGet:
    post:
      tags: [Hash]
      operationId: Cache_HGet
      summary: Get field
      description: Missing hash or field → present=false. ModeHash only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HFieldRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HGetResponse"

  /supercache.cache.v1.Cache/HDel:
    post:
      tags: [Hash]
      operationId: Cache_HDel
      summary: Delete field
      description: No-op if missing. Does not Delete the hash name. ModeHash only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HFieldRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Empty"

  /supercache.cache.v1.Cache/HExists:
    post:
      tags: [Hash]
      operationId: Cache_HExists
      summary: Field exists
      description: Missing hash or field → present=false. ModeHash only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HFieldRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HExistsResponse"

  /supercache.cache.v1.Cache/HLen:
    post:
      tags: [Hash]
      operationId: Cache_HLen
      summary: Field count
      description: Missing hash → len=0. ModeHash only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HLenResponse"

  /supercache.cache.v1.Cache/HGetAll:
    post:
      tags: [Hash]
      operationId: Cache_HGetAll
      summary: All fields
      description: Field-byte order. Missing → empty. ModeHash only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HGetAllResponse"

  /supercache.cache.v1.Cache/Incr:
    post:
      tags: [Counter]
      operationId: Cache_Incr
      summary: Add delta
      description: ModeCounter only. Creates at delta if missing. Returns the new int64. Overflow → invalid argument.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncrRequest"
      responses:
        "200":
          description: New value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncrResponse"

  /supercache.cache.v1.Cache/CounterGet:
    post:
      tags: [Counter]
      operationId: Cache_CounterGet
      summary: Read counter
      description: Missing → present=false, value=0. ModeCounter only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NameRequest"
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterGetResponse"

components:
  schemas:
    Empty:
      type: object
    GetRequest:
      type: object
      required: [keyspace, key]
      properties:
        keyspace:
          type: string
        key:
          type: string
    GetResponse:
      type: object
      properties:
        found:
          type: boolean
        value:
          type: string
          format: byte
          description: Raw bytes (base64 in JSON mapping)
    PutRequest:
      type: object
      required: [keyspace, key, value]
      properties:
        keyspace:
          type: string
        key:
          type: string
        value:
          type: string
          format: byte
        ttl_nanos:
          type: integer
          format: int64
        ttl_set:
          type: boolean
    PutResponse:
      type: object
    KV:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
          format: byte
    PutManyRequest:
