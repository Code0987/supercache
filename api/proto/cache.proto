syntax = "proto3";

package supercache.cache.v1;

option go_package = "github.com/Code0987/supercache/api/gen/cache/v1;cachev1";

// Cache is the application-facing API (not the peer mesh).
service Cache {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc PutMany(PutManyRequest) returns (PutManyResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc DeleteMany(DeleteManyRequest) returns (DeleteManyResponse);
  rpc BloomAdd(BloomAddRequest) returns (BloomAddResponse);
  rpc BloomTest(BloomTestRequest) returns (BloomTestResponse);
  rpc SetAdd(SetAddRequest) returns (SetAddResponse);
  rpc SetRemove(SetRemoveRequest) returns (SetRemoveResponse);
  rpc SetContains(SetContainsRequest) returns (SetContainsResponse);
  rpc SetCard(SetCardRequest) returns (SetCardResponse);
  rpc SetMembers(SetMembersRequest) returns (SetMembersResponse);
  rpc ZAdd(ZAddRequest) returns (ZAddResponse);
  rpc ZRem(ZRemRequest) returns (ZRemResponse);
  rpc ZScore(ZScoreRequest) returns (ZScoreResponse);
  rpc ZCard(ZCardRequest) returns (ZCardResponse);
  rpc ZRange(ZRangeRequest) returns (ZRangeResponse);
  rpc ZRangeByScore(ZRangeByScoreRequest) returns (ZRangeResponse);
  rpc GeoAdd(GeoAddRequest) returns (GeoAddResponse);
  rpc GeoRem(GeoRemRequest) returns (GeoRemResponse);
  rpc GeoPos(GeoPosRequest) returns (GeoPosResponse);
  rpc GeoCard(GeoCardRequest) returns (GeoCardResponse);
  rpc GeoDist(GeoDistRequest) returns (GeoDistResponse);
  rpc GeoRadius(GeoRadiusRequest) returns (GeoRadiusResponse);
  rpc LPush(LPushRequest) returns (LPushResponse);
  rpc RPush(RPushRequest) returns (RPushResponse);
  rpc LPop(LPopRequest) returns (LPopResponse);
  rpc RPop(RPopRequest) returns (RPopResponse);
  rpc LLen(LLenRequest) returns (LLenResponse);
  rpc LIndex(LIndexRequest) returns (LIndexResponse);
  rpc LRange(LRangeRequest) returns (LRangeResponse);
  rpc HSet(HSetRequest) returns (HSetResponse);
  rpc HGet(HGetRequest) returns (HGetResponse);
  rpc HDel(HDelRequest) returns (HDelResponse);
  rpc HExists(HExistsRequest) returns (HExistsResponse);
  rpc HLen(HLenRequest) returns (HLenResponse);
  rpc HGetAll(HGetAllRequest) returns (HGetAllResponse);
  rpc Incr(IncrRequest) returns (IncrResponse);
  rpc CounterGet(CounterGetRequest) returns (CounterGetResponse);
  rpc JsonSet(JsonSetRequest) returns (JsonSetResponse);
  rpc JsonGet(JsonGetRequest) returns (JsonGetResponse);
  rpc JsonDel(JsonDelRequest) returns (JsonDelResponse);
}

message GetRequest {
  string keyspace = 1;
  string key = 2;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
}

message PutRequest {
  string keyspace = 1;
  string key = 2;
  bytes value = 3;
  int64 ttl_nanos = 4;
  bool ttl_set = 5;
}

message PutResponse {}

message KV {
  string key = 1;
  bytes value = 2;
}

message PutManyRequest {
  string keyspace = 1;
  repeated KV items = 2;
  int64 ttl_nanos = 3;
  bool ttl_set = 4;
}

message KeyError {
  string key = 1;
  string message = 2;
  // Optional structured peer failures (e.g. DeleteMany wrapping MultiError).
  repeated PeerFailure peer_failures = 3;
}

message PutManyResponse {
  repeated KeyError errors = 1;
}

message DeleteRequest {
  string keyspace = 1;
  string key = 2;
}

message PeerFailure {
  string peer_id = 1;
  string message = 2;
}

message DeleteResponse {
  repeated PeerFailure peer_failures = 1;
}

message DeleteManyRequest {
  string keyspace = 1;
  repeated string keys = 2;
}

message DeleteManyResponse {
  repeated KeyError errors = 1;
}

message BloomAddRequest {
  string keyspace = 1;
  string name = 2;
  bytes item = 3;
}

message BloomAddResponse {}

message BloomTestRequest {
  string keyspace = 1;
  string name = 2;
  bytes item = 3;
}

message BloomTestResponse {
  bool maybe = 1; // false = definitely not present
}

message SetAddRequest {
  string keyspace = 1;
  string name = 2;
  bytes item = 3;
}

message SetAddResponse {}

message SetRemoveRequest {
  string keyspace = 1;
  string name = 2;
  bytes item = 3;
}

message SetRemoveResponse {}

message SetContainsRequest {
  string keyspace = 1;
  string name = 2;
  bytes item = 3;
}

message SetContainsResponse {
  bool present = 1;
}

message SetCardRequest {
  string keyspace = 1;
  string name = 2;
}

message SetCardResponse {
  int64 card = 1;
}

message SetMembersRequest {
  string keyspace = 1;
  string name = 2;
}

message SetMembersResponse {
  repeated bytes members = 1;
}

message ZMember {
  bytes member = 1;
  double score = 2;
}

message ZAddRequest {
  string keyspace = 1;
  string name = 2;
  bytes member = 3;
  double score = 4;
}

message ZAddResponse {}

message ZRemRequest {
  string keyspace = 1;
  string name = 2;
  bytes member = 3;
}

message ZRemResponse {}

message ZScoreRequest {
  string keyspace = 1;
  string name = 2;
  bytes member = 3;
}

message ZScoreResponse {
  bool present = 1;
  double score = 2;
}

message ZCardRequest {
  string keyspace = 1;
  string name = 2;
}

message ZCardResponse {
  int64 card = 1;
}

message ZRangeRequest {
  string keyspace = 1;
  string name = 2;
  int32 start = 3;
  int32 stop = 4;
}

message ZRangeByScoreRequest {
  string keyspace = 1;
  string name = 2;
  double min = 3;
  double max = 4;
}

message ZRangeResponse {
  repeated ZMember members = 1;
}

message GeoMember {
  bytes member = 1;
  double lon = 2;
  double lat = 3;
  double dist_meters = 4;
}

message GeoAddRequest {
  string keyspace = 1;
  string name = 2;
  bytes member = 3;
  double lon = 4;
  double lat = 5;
}

message GeoAddResponse {}

message GeoRemRequest {
  string keyspace = 1;
  string name = 2;
  bytes member = 3;
}

message GeoRemResponse {}

message GeoPosRequest {
  string keyspace = 1;
  string name = 2;
  bytes member = 3;
}

message GeoPosResponse {
  bool present = 1;
  double lon = 2;
  double lat = 3;
}

message GeoCardRequest {
  string keyspace = 1;
  string name = 2;
}

message GeoCardResponse {
  int64 card = 1;
}

message GeoDistRequest {
  string keyspace = 1;
  string name = 2;
  bytes a = 3;
  bytes b = 4;
}

message GeoDistResponse {
  bool present = 1;
  double meters = 2;
}

message GeoRadiusRequest {
  string keyspace = 1;
  string name = 2;
  double lon = 3;
  double lat = 4;
  double radius_meters = 5;
  int32 limit = 6;
}

message GeoRadiusResponse {
  repeated GeoMember members = 1;
}

message LPushRequest {
  string keyspace = 1;
  string name = 2;
  bytes item = 3;
}
message LPushResponse {}

message RPushRequest {
  string keyspace = 1;
  string name = 2;
  bytes item = 3;
}
message RPushResponse {}

message LPopRequest {
  string keyspace = 1;
  string name = 2;
}
message LPopResponse {
  bool present = 1;
  bytes item = 2;
}

message RPopRequest {
  string keyspace = 1;
  string name = 2;
}
message RPopResponse {
  bool present = 1;
  bytes item = 2;
}

message LLenRequest {
  string keyspace = 1;
  string name = 2;
}
message LLenResponse {
  int64 len = 1;
}

message LIndexRequest {
  string keyspace = 1;
  string name = 2;
  int32 index = 3;
}
message LIndexResponse {
  bool present = 1;
  bytes item = 2;
}

message LRangeRequest {
  string keyspace = 1;
  string name = 2;
  int32 start = 3;
  int32 stop = 4;
}
message LRangeResponse {
  repeated bytes items = 1;
}

message HSetRequest {
  string keyspace = 1;
  string name = 2;
  bytes field = 3;
  bytes value = 4;
}
message HSetResponse {}

message HGetRequest {
  string keyspace = 1;
  string name = 2;
  bytes field = 3;
}
message HGetResponse {
  bool present = 1;
  bytes value = 2;
}

message HDelRequest {
  string keyspace = 1;
  string name = 2;
  bytes field = 3;
}
message HDelResponse {}

message HExistsRequest {
  string keyspace = 1;
  string name = 2;
  bytes field = 3;
}
message HExistsResponse {
  bool present = 1;
}

message HLenRequest {
  string keyspace = 1;
  string name = 2;
}
message HLenResponse {
  int64 len = 1;
}

message HGetAllRequest {
  string keyspace = 1;
  string name = 2;
}

message HashField {
  bytes field = 1;
  bytes value = 2;
}

message HGetAllResponse {
  repeated HashField fields = 1;
}

message IncrRequest {
  string keyspace = 1;
  string name = 2;
  int64 delta = 3;
}
message IncrResponse {
  int64 value = 1;
}

message CounterGetRequest {
  string keyspace = 1;
  string name = 2;
}
message CounterGetResponse {
  bool present = 1;
  int64 value = 2;
}

message JsonSetRequest {
  string keyspace = 1;
  string name = 2;
  string path = 3;
  bytes value = 4;
}
message JsonSetResponse {}

message JsonGetRequest {
  string keyspace = 1;
  string name = 2;
  string path = 3;
}
message JsonGetResponse {
  bool present = 1;
  bytes value = 2;
}

message JsonDelRequest {
  string keyspace = 1;
  string name = 2;
  string path = 3;
}
message JsonDelResponse {}
