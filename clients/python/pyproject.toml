[project]
name = "supercache"
version = "0.1.0"
description = "SuperCache Cache gRPC client for Python"
requires-python = ">=3.11"
dependencies = ["grpcio>=1.69,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "grpcio-tools==1.69.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
